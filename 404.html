<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Page not found | RAWah ELHOWERIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f7e9a6'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%23262624'%3ERE%3C/text%3E%3C/svg%3E">
<style>
/* Self-contained on purpose: this page can be shown at any URL depth, so it needs no external files. */
:root{--paper:#faf9f5;--butter:#f7e9a6;--ink:#262624;--soft:#55554f}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:2rem;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;overflow:hidden;position:relative}
.disc{position:absolute;width:min(90vw,720px);aspect-ratio:1;border-radius:50%;background:var(--butter);right:-18vw;top:-14vw}
.ring{position:absolute;width:min(60vw,480px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(38,38,36,.3);left:-12vw;bottom:-18vw}
main{position:relative;max-width:40rem}
.code{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-size:clamp(7rem,28vw,17rem);line-height:.85;letter-spacing:-.03em}
h1{margin-top:1rem;font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05}
p{margin-top:.9rem;color:var(--soft)}
.btn{display:inline-block;margin-top:2rem;padding:1rem 1.8rem;border-radius:999px;background:var(--ink);color:#fff;font-weight:650;font-size:.85rem;letter-spacing:.12em;text-decoration:none;transition:background .4s,color .4s}
.btn:hover{background:var(--butter);color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.name{margin-top:3rem;font-family:"Instrument Serif",Georgia,serif;font-size:1.3rem}
</style>
</head>
<body>
<div class="disc" aria-hidden="true"></div><div class="ring" aria-hidden="true"></div>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>404 – Page not found</h1>
  <p>The page you were looking for doesn't exist or has moved.</p>
  <a class="btn" id="home" href="/">BACK TO HOME</a>
  <p class="name">RAWah ELHOWERIS, Dentist</p>
</main>
<script>
(function(){
  // set_site_url.py fills HOME automatically. Otherwise guess: on github.io project sites the repo name is the first folder.
  var HOME = "";
  var a = document.getElementById("home");
  if (HOME) { a.href = HOME; return; }
  var seg = location.pathname.split("/").filter(Boolean);
  if (/\.github\.io$/.test(location.hostname) && seg.length > 1) a.href = "/" + seg[0] + "/";
})();
</script>
</body>
</html>
